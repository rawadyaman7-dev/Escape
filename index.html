<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Locked Content</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      margin-top: 12px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #4caf50;
      color: white;
    }
    .message {
      margin-top: 10px;
      min-height: 20px;
    }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔒 Enter the Code</h2>

    <input id="codeInput" type="password" placeholder="Code..." />
    <button onclick="unlock()">Unlock</button>

    <div class="message" id="message"></div>

    <video id="video" class="hidden" controls>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    // 🔑 CHANGE YOUR CODE HERE
    const SECRET_CODE = "1234";

    function unlock() {
      const input = document.getElementById("codeInput");
      const message = document.getElementById("message");
      const video = document.getElementById("video");

      if (input.value === SECRET_CODE) {
        message.textContent = "✅ Access granted";
        message.style.color = "lightgreen";
        video.classList.remove("hidden");
        input.disabled = true;
        video.play().catch(() => {});
      } else {
        message.textContent = "❌ Wrong code, try again";
        message.style.color = "red";
        input.select();
      }
    }
  </script>

</body>
</html>
