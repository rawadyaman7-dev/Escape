<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Locked CCTV Grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#111;
      color:#fff;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Unlock card */
    .container{
      background:#1e1e1e;
      padding:30px;
      border-radius:12px;
      width:420px;
      text-align:center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    input{
      width:100%;
      padding:12px;
      font-size:16px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      outline:none;
    }
    button{
      width:100%;
      padding:12px;
      font-size:16px;
      margin-top:12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      background:#4caf50;
      color:white;
    }
    .message{
      margin-top:10px;
      min-height:20px;
    }

    /* Fullscreen CCTV overlay */
    .overlay{
      position:fixed;
      inset:0;
      background:#000;
      display:none;              /* hidden until shown */
      z-index:9999;
    }
    .overlay.show{
      display:block;
    }

    /* Top bar */
    .topbar{
      height:54px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid rgba(255,255,255,0.12);
      background:rgba(10,10,10,0.85);
      box-sizing:border-box;
    }
    .topbar .left{
      font-weight:700;
      letter-spacing:0.8px;
      font-size:14px;
      opacity:0.9;
    }
    .topbar .right{
      display:flex;
      gap:12px;
      align-items:center;
      font-size:12px;
      opacity:0.85;
    }
    .pill{
      border:1px solid rgba(255,255,255,0.18);
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.05);
    }
    .exitBtn{
      cursor:pointer;
      border:none;
      border-radius:10px;
      padding:8px 12px;
      background:rgba(255,255,255,0.12);
      color:#fff;
      font-weight:600;
    }

    /* CCTV grid */
    .grid{
      height: calc(100% - 54px);
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:10px;
      padding:10px;
      box-sizing:border-box;
    }

    .cam{
      position:relative;
      border:1px solid rgba(255,255,255,0.15);
      border-radius:14px;
      overflow:hidden;
      background:#050505;
      cursor:pointer;
    }

    .cam img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.05) brightness(0.95);
    }

    /* Camera label */
    .label{
      position:absolute;
      left:10px;
      top:10px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.6px;
      background:rgba(0,0,0,0.45);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.15);
      user-select:none;
    }

    /* REC dot */
    .rec{
      position:absolute;
      right:10px;
      top:10px;
      display:flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:700;
      background:rgba(0,0,0,0.45);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.15);
      user-select:none;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#ff3b30;
      box-shadow: 0 0 10px rgba(255,59,48,0.8);
    }

    /* Hide unlock card when unlocked */
    .hide{
      display:none;
    }

    /* Single cam view area */
    .singleWrap{
      height: calc(100% - 54px);
      box-sizing:border-box;
    }
    .singleCam{
      height:100%;
      width:100%;
      position:relative;
      background:#000;
      overflow:hidden;
    }
    .singleCam img{
      height:100%;
      width:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.05) brightness(0.95);
    }

    @media (max-width: 520px){
      .container{ width: 92vw; }
      .grid{ gap:8px; padding:8px; }
      .cam{ border-radius:12px; }
    }
  </style>
</head>

<body>

  <!-- Unlock UI -->
  <div class="container" id="unlockCard">
    <h2>🔒 Surveillance Cameras</h2>

    <!-- Visible typing -->
    <input id="codeInput" type="text" placeholder="Enter code..." autocomplete="off" />

    <button id="unlockBtn">Unlock</button>
    <div class="message" id="message"></div>
  </div>

  <!-- Fullscreen CCTV GRID -->
  <div class="overlay" id="overlay">
    <div class="topbar">
      <div class="left">CCTV MONITOR • LIVE FEED</div>
      <div class="right">
        <div class="pill" id="clock">--:--:--</div>
        <button class="exitBtn" id="exitBtn">Exit</button>
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="cam" onclick="openCam(this)">
        <img src="cam1.jpg" alt="Camera 1" />
        <div class="label">CAM 01</div>
        <div class="rec"><span class="dot"></span>REC</div>
      </div>

      <div class="cam" onclick="openCam(this)">
        <img src="cam2.jpg" alt="Camera 2" />
        <div class="label">CAM 02</div>
        <div class="rec"><span class="dot"></span>REC</div>
      </div>

      <div class="cam" onclick="openCam(this)">
        <img src="cam3.jpg" alt="Camera 3" />
        <div class="label">CAM 03</div>
        <div class="rec"><span class="dot"></span>REC</div>
      </div>

      <div class="cam" onclick="openCam(this)">
        <img src="cam4.jpg" alt="Camera 4" />
        <div class="label">CAM 04</div>
        <div class="rec"><span class="dot"></span>REC</div>
      </div>
    </div>
  </div>

  <!-- FULLSCREEN SINGLE CAM OVERLAY -->
  <div class="overlay" id="camOverlay">
    <div class="topbar">
      <div class="left" id="camTitle">CAM • FULL VIEW</div>
      <div class="right">
        <div class="pill" id="clock2">--:--:--</div>
        <button class="exitBtn" onclick="closeCam()">Back</button>
      </div>
    </div>

    <div class="singleWrap">
      <div class="singleCam" onclick="closeCam()">
        <img id="camView" src="" alt="Camera View" />
        <div class="label" id="camLabel"></div>
        <div class="rec"><span class="dot"></span>REC</div>
      </div>
    </div>
  </div>

  <script>
    // 🔑 Change your secret code here
    const SECRET_CODE = "centaurewednesday~26";

    const input = document.getElementById("codeInput");
    const btn = document.getElementById("unlockBtn");
    const msg = document.getElementById("message");

    const overlay = document.getElementById("overlay");
    const unlockCard = document.getElementById("unlockCard");
    const exitBtn = document.getElementById("exitBtn");

    const camOverlay = document.getElementById("camOverlay");
    const camView = document.getElementById("camView");
    const camLabel = document.getElementById("camLabel");
    const camTitle = document.getElementById("camTitle");

    const clockEl = document.getElementById("clock");
    const clockEl2 = document.getElementById("clock2");

    function updateClock(){
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      const t = `${hh}:${mm}:${ss}`;
      clockEl.textContent = t;
      clockEl2.textContent = t;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function enterFullscreen(el){
      // Fullscreen must be triggered by a user action
      try{
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen(); // Safari
      }catch(e){
        // If it fails, overlay still works normally
      }
    }

    function unlock(){
      if (input.value === SECRET_CODE){
        msg.textContent = "✅ Access granted";
        msg.style.color = "lightgreen";

        overlay.classList.add("show");
        unlockCard.classList.add("hide");

        // Try fullscreen on the grid overlay
        enterFullscreen(overlay);
      } else {
        msg.textContent = "❌ Wrong code. Try again.";
        msg.style.color = "red";
        input.select();
      }
    }

    function exitView(){
      overlay.classList.remove("show");
      camOverlay.classList.remove("show");
      unlockCard.classList.remove("hide");

      input.value = "";
      msg.textContent = "";
      input.focus();

      // Exit fullscreen if active
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen?.();
    }

    // Open single camera fullscreen
    function openCam(cam){
      const img = cam.querySelector("img");
      const labelText = cam.querySelector(".label")?.textContent || "CAM";

      camView.src = img.src;
      camLabel.textContent = labelText;
      camTitle.textContent = labelText + " • FULL VIEW";

      camOverlay.classList.add("show");

      // Try fullscreen for single cam overlay
      enterFullscreen(camOverlay);
    }

    // Close single camera view
    function closeCam(){
      camOverlay.classList.remove("show");

      // If currently fullscreen, exit it (returns to grid)
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen?.();
    }

    btn.addEventListener("click", unlock);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });

    exitBtn.addEventListener("click", exitView);

    // ESC behavior:
    // - If single cam open => close it
    // - Else if grid open => exit all
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (camOverlay.classList.contains("show")) closeCam();
        else if (overlay.classList.contains("show")) exitView();
      }
    });
  </script>

</body>
</html>
