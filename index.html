<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Locked Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #4caf50;
      color: white;
    }

    .message {
      margin-top: 10px;
      min-height: 20px;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔒 Enter the Code</h2>

    <input
      id="codeInput"
      type="password"
      placeholder="Enter code..."
      autocomplete="off"
    />

    <button onclick="unlock()">Unlock</button>

    <div class="message" id="message"></div>

    <!-- LOOPING VIDEO -->
    <video
      id="video"
      class="hidden"
      loop
      muted
      playsinline
    >
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    // 🔑 CHANGE YOUR SECRET CODE HERE
    const SECRET_CODE = "1234";

    function unlock() {
      const input = document.getElementById("codeInput");
      const message = document.getElementById("message");
      const video = document.getElementById("video");

      if (input.value === SECRET_CODE) {
        message.textContent = "✅ Access granted";
        message.style.color = "lightgreen";

        video.classList.remove("hidden");

        video.currentTime = 0;
        video.play(); // required for GitHub Pages & mobile

        input.disabled = true;
      } else {
        message.textContent = "❌ Wrong code. Try again.";
        message.style.color = "red";
        input.select();
      }
    }
  </script>

</body>
</html>
